<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#CBE7FF">

    <title>Challenge Management | LevelUp</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body data-page="admin-challenges" data-require-role="admin">
    <div class="app-frame">
        <div class="app-surface">
            <header
                class="topbar"
                id="site-header"
                aria-label="LevelUp navigation"
            ></header>

            <aside
                id="app-sidebar"
                class="hidden"
                aria-hidden="true"
            ></aside>

            <main class="page-content" id="page-content">
                <div class="page-heading modern-heading">
                    <div class="admin-heading">
                        <div>
                            <span class="eyebrow">CONTENT MANAGEMENT</span>
                            <h1>Challenge Management</h1>
                            <p>
                                Create challenges with clear goals, criteria, and proof methods.
                            </p>
                        </div>

                        <span class="admin-marker">ADMIN</span>
                    </div>

                    <a href="challenge-form.html" class="btn btn-primary shadow-hover">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px; vertical-align: middle;"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                        Create Challenge
                    </a>
                </div>

                <!-- Bagian KPI yang diperbarui sesuai desain baru -->
                <section class="grid grid-3 admin-kpis">
                    <article class="card stat-card modern-stat card-blue">
                        <div class="stat-content">
                            <div class="stat-label">ACTIVE</div>
                            <div class="stat-value" id="challenge-active-count">0</div>
                        </div>
                        <div class="stat-visuals">
                            <div class="stat-icon-wrap glass-icon">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                            </div>
                            <div class="stat-badge badge-green">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>
                                +12% This week
                            </div>
                        </div>
                    </article>

                    <article class="card stat-card modern-stat card-yellow">
                        <div class="stat-content">
                            <div class="stat-label">DRAFT</div>
                            <div class="stat-value" id="challenge-draft-count">0</div>
                        </div>
                        <div class="stat-visuals">
                            <div class="stat-icon-wrap glass-icon">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                            </div>
                            <div class="stat-info-text">0 pending approval</div>
                        </div>
                    </article>

                    <article class="card stat-card modern-stat card-lavender">
                        <div class="stat-content">
                            <div class="stat-label">ARCHIVED</div>
                            <div class="stat-value" id="challenge-archived-count">0</div>
                        </div>
                        <div class="stat-visuals">
                            <div class="stat-icon-wrap glass-icon">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="21 8 21 21 3 21 3 8"></polyline><rect x="1" y="3" width="22" height="5"></rect><line x1="10" y1="12" x2="14" y2="12"></line></svg>
                            </div>
                            <div class="stat-info-text">No active archives</div>
                        </div>
                    </article>
                </section>

                <section class="section">
                    <div class="modern-toolbar">
                        <div class="search-wrapper">
                            <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                            <input
                                id="admin-challenge-search"
                                class="search-input"
                                type="search"
                                placeholder="Search challenges..."
                            >
                        </div>

                        <div class="filter-group">
                            <select
                                id="admin-challenge-status"
                                class="filter-select"
                                style="max-width: 180px"
                            >
                                <option value="all">All statuses</option>
                                <option value="active">Active</option>
                                <option value="draft">Draft</option>
                                <option value="archived">Archived</option>
                            </select>

                            <select
                                id="admin-challenge-category"
                                class="filter-select"
                                style="max-width: 210px"
                            >
                                <option value="all">All categories</option>
                                <option value="learning">Learning & Focus</option>
                                <option value="creative">Creative & Digital Skills</option>
                                <option value="healthy">Healthy Habits</option>
                            </select>
                        </div>
                    </div>

                    <div class="modern-table-wrap">
                        <table class="modern-table">
                            <thead>
                                <tr>
                                    <th>Challenge Info</th>
                                    <th>Category</th>
                                    <th>Verification</th>
                                    <th>Status</th>
                                    <th class="align-right">Action</th>
                                </tr>
                            </thead>

                            <tbody id="admin-challenge-table"></tbody>
                        </table>
                    </div>

                    <div id="admin-challenge-empty" class="section hidden"></div>
                </section>
            </main>

            <footer class="app-footer"></footer>
        </div>

        <div class="app-main-footer">
            LevelUp · Growth at your own pace.
        </div>
    </div>

    <div class="toast-root" id="toast-root" aria-live="polite"></div>

    <script defer src="../js/storage.js"></script>
    <script defer src="../js/data.js"></script>
    <script defer src="../js/auth.js"></script>
    <script defer src="../js/ui.js"></script>
    <script defer src="../js/progression.js"></script>
    <script defer src="../js/admin/challenges.js"></script>
</body>
</html>
